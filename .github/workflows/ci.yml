name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.2'
          check-latest: false
      - name: build and vet
        run: |
          go build ./...
          go vet ./...
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "not gofmt'd: $unformatted" >&2
            exit 1
          fi
      - name: staticcheck
        # dominikh/go-tools#1832: staticcheck 2026.2.1 cannot read the export
        # data go1.27.2 writes. Lint under go1.27.1 until a fixed release ships;
        # build, test and govulncheck stay on go1.27.2.
        env:
          GOTOOLCHAIN: go1.27.1
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@2026.2.1
          staticcheck ./...
      - name: tests
        run: go test ./... -race
      - name: every scenario is bound to a test
        run: ./scripts/features-are-bound.sh
      - name: the README's numbers are true
        run: ./scripts/readme-numbers.sh
      - name: the Dockerfile's base images are pinned by digest
        run: ./scripts/base-images-pinned-by-digest.sh
      - name: every dependency is argued
        run: ./scripts/dependencies-are-argued.sh
      - name: no quote of the owner, no attribution by name
        run: ./scripts/no-owner-quotes.sh
      - name: no long dash
        run: ./scripts/no-long-dashes.sh --prove
      - name: the gates have teeth
        run: ./scripts/gates-have-teeth.sh

  security:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.2'
          check-latest: false
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          govulncheck ./...
      # A finding is fixed or argued in the pull request; a #nosec carries its
      # rule and its reason on the same line. Nothing is suppressed by default.
      - name: gosec
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@v2.29.0
          gosec -quiet ./...
